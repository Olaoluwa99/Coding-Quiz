<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen"
  >
    <div class="bg-gray-800 rounded-lg shadow-lg p-6 w-full max-w-xl">
      <h1 class="text-2xl font-bold mb-4 text-green-400">Coding Quiz</h1>

      <div id="quiz-container">
        <div id="question" class="text-lg font-medium mb-4"></div>
        <div id="options" class="flex flex-col gap-3 mb-4"></div>
        <button
          id="nextBtn"
          class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700"
        >
          Next
        </button>
      </div>

      <div
        id="score-container"
        class="hidden text-xl font-semibold text-green-300 text-center mt-4"
      ></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
